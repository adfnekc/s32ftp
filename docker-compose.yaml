services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ftp &&
      echo 'bucket ftp ready'
      "

  s32ftp:
    build:
      context: .
      args:
        VERSION: docker
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S32FTP_FTP_LISTEN_IP: "0.0.0.0"
      S32FTP_FTP_PORT: "2121"
      S32FTP_FTP_PUBLIC_HOST: "127.0.0.1"
      S32FTP_FTP_PASSIVE_PORT_RANGE: "50000-50100"
      S32FTP_S3_ENDPOINT_URL: "http://minio:9000"
      S32FTP_S3_REGION: "us-east-1"
      S32FTP_S3_ACCESS_KEY_ID: "minioadmin"
      S32FTP_S3_SECRET_ACCESS_KEY: "minioadmin"
      S32FTP_S3_BUCKET: "ftp"
      S32FTP_S3_FORCE_PATH_STYLE: "true"
      S32FTP_LOG_LEVEL: "info"
    ports:
      - "2121:2121"
      - "50000-50100:50000-50100"
    volumes:
      - ./configs/config.example.yaml:/etc/s32ftp/config.yaml:ro

volumes:
  minio-data:
